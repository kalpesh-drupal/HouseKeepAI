version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: housekeep
      POSTGRES_PASSWORD: housekeep
      POSTGRES_DB: housekeepai
    ports:
      - "5432:5432"
    volumes:
      - housekeep_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housekeep -d housekeepai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  housekeep_pg:
